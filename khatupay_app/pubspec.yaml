name: khatupay_app
description: Khatu Pay mobile app
publish_to: "none"
version: 1.0.1+33
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.3
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  razorpay_flutter: ^1.3.7
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^17.2.3
  flutter_contacts: ^2.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  permission_handler: ^12.0.1
  flutter_screenutil: ^5.9.0
  flutter_easyloading: ^3.0.5
  connectivity_plus: ^6.0.5
  local_auth: ^2.3.0
  pdf: ^3.10.7
  path_provider: ^2.1.3
  open_file: ^3.3.2
  printing: ^5.12.0
  share_plus: ^10.1.2
  socket_io_client: ^3.0.2
  pin_code_fields: ^8.0.1
  package_info_plus: ^8.0.2
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/banners/
    - assets/illustrations/
    - assets/services/
    - assets/loans/
    - assets/business/
    - assets/profile/
    - assets/notifications/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/playstore-icon.png"
  web:
    generate: true
    image_path: "assets/playstore-icon.png"
    background_color: "#ffffff"
    theme_color: "#0F766E"

flutter_native_splash:
  color: "#ffffff"
  image: assets/playstore-icon.png
  android: true
  ios: true
